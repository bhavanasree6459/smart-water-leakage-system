<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="mobile-container">
    <!-- Header -->
    <div class="mobile-header">
        <div class="header-left">
            <h2>Dashboard</h2>
        </div>
        <div class="header-right">
            <i class="fas fa-bell"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="mobile-content">
        <!-- System Status Card -->
        <div class="status-card">
            <div class="status-badge">
                <i class="fas fa-check-circle"></i>
                <span>NORMAL</span>
            </div>
            <p class="status-text">Public Water Network is Safe</p>
        </div>

        <!-- Network Overview Section -->
        <h3 class="section-title">Network Overview</h3>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-icon">
                    <i class="fas fa-microchip"></i>
                </div>
                <div class="metric-info">
                    <p class="metric-label">Sensors Online</p>
                    <p class="metric-value">24</p>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-icon">
                    <i class="fas fa-signal"></i>
                </div>
                <div class="metric-info">
                    <p class="metric-label">Network Status</p>
                    <p class="metric-value">96%</p>
                </div>
            </div>
        </div>

        <!-- Additional Metrics -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-icon leak">
                    <i class="fas fa-water"></i>
                </div>
                <div class="metric-info">
                    <p class="metric-label">Active Leaks</p>
                    <p class="metric-value">2</p>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-icon pressure">
                    <i class="fas fa-gauge"></i>
                </div>
                <div class="metric-info">
                    <p class="metric-label">Water Pressure</p>
                    <p class="metric-value">2.6 bar</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <h3 class="section-title">Quick Actions</h3>
        <div class="quick-actions">
            <a href="monitoring.html" class="action-btn">
                <i class="fas fa-map"></i>
                <span>Use Map</span>
            </a>
            <a href="alerts.html" class="action-btn">
                <i class="fas fa-exclamation-circle"></i>
                <span>Leakage Alerts</span>
            </a>
            <a href="reports.html" class="action-btn">
                <i class="fas fa-file-chart-line"></i>
                <span>Reports</span>
            </a>
            <a href="settings.html" class="action-btn">
                <i class="fas fa-wrench"></i>
                <span>Maintenance</span>
            </a>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="mobile-nav">
        <a href="dashboard.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="monitoring.html" class="nav-item">
            <i class="fas fa-map"></i>
            <span>Map</span>
        </a>
        <a href="alerts.html" class="nav-item">
            <i class="fas fa-bell"></i>
            <span>Alerts</span>
        </a>
        <a href="reports.html" class="nav-item">
            <i class="fas fa-chart-bar"></i>
            <span>Reports</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </a>
    </nav>
</div>

<script src="js/dashboard.js"></script>

</body>
</html>
